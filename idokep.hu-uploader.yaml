blueprint:
  name: Időkép Automata Feltöltő (Univerzális)
  description: >-
    Beküldi az okosotthon meteorológiai adatait az Időkép állomásodhoz, a Home
    Assistant beépített `rest_command` integrációjával.


    **Előfeltétel:** a `rest_command.idokep_get` parancsnak léteznie kell a
    `configuration.yaml` fájlban. A helyes forma:


    ```yaml

    rest_command:
      idokep_get:
        url: "{{ url }}"
        method: get
        headers:
          User-Agent: "IdokepAutomata/500 (Windows)"
        timeout: 15
    ```


    A blokk felvétele után indítsd újra a Home Assistantot.


    **Fióktípus:** az Időképen kétféle fiók létezik, Normál és Pro. A legtöbb
    állomáshoz a Normál fiók megfelelő, Pro fiókra csak speciális esetekben van
    szükség. Ha a fiókodat a [haladó szintű
    regisztrációval](https://www.idokep.hu/regisztracio?szint=halado) hoztad
    létre, akkor Normál fiókod van. A fióktípust az „Időkép fiók” részben
    választhatod ki; alapértelmezés a Normál.


    **Frissítés 1.x-ről:** a 2.0 a `shell_command` helyett `rest_command`-ot
    használ. Vedd fel a fenti blokkot, indítsd újra a Home Assistantot, és csak
    utána importáld újra a sablon-automatizmust. A régi `shell_command.idokep_get`
    sor ezután törölhető. Az automatizmusod beállításait nem kell módosítani,
    kivéve ha Pro fiókod van: ekkor a Fióktípusnál válaszd a Pro-t.


    **Hibakezelés:** ha az Időkép hibakóddal (4xx/5xx) válaszol, vagy nem
    válaszol időben, a Home Assistant ezt a rendszernaplóba írja. A válasz
    szövegét a sablon-automatizmus nem ellenőrzi.


    **Biztonsági megjegyzés:** a beküldés titkosított HTTPS-kapcsolaton megy,
    de a jelszó az URL része, ezért hiba esetén a Home Assistant a teljes
    URL-t — benne az állomás jelszavával — kiírhatja a rendszernaplóba, ami
    bekerül a diagnosztikai csomagokba és a biztonsági mentésekbe is. Használj
    az Időkép-állomásodhoz külön, máshol nem használt jelszót.


    **Feltöltési formátum (csak Normál fióknál):** kétféle beküldés közül
    választhatsz. Az **Időkép formátum** a megszokott `sendws.php` beküldés,
    metrikus mértékegységekkel. A **Weather Underground formátum** az Időkép
    `automata.idokep.hu` címére küld, a WU protokoll mezőneveivel és
    mértékegységeivel (°F, inHg, mph, inch). Pro fióknál a beküldés mindig
    Időkép formátumú. Hogy melyik adat melyik formátumban milyen néven megy
    fel, azt az egyes mezők leírása mutatja.


    **Csapadék:** az éjfél óta mért **napi** csapadék mindkét formátumban
    felmegy: Időkép formátumban `csapdaily`, WU formátumban `dailyrainin`
    néven. A `csap` mező az elmúlt **24 óra** (gördülő) csapadékát kapja, ez
    csak az Időkép formátumban megy fel. Az 1 órás csapadék mindkettőben
    felmegy.


    **Globálsugárzás:** a napsugárzást az Időkép csak a **WU formátumban**
    fogadja globálsugárzásként. Időkép formátumban `napfeny` néven felmegy,
    de az állomás oldalán globálsugárzásként nem jelenik meg.


    **Mértékegységek:** a szenzorok saját mértékegységét a sablon kiolvassa,
    és a választott formátumnak megfelelően váltja át (szél: km/h, m/s, mph
    és csomó támogatott). A szélirány fokban vagy égtáj-rövidítésként is
    megadható. Időkép formátumban a napsugárzás egész számra kerekített
    W/m²-ben megy, mert ott csak egész számot fogad el az Időkép; lux
    mértékegységű szenzor értékét a sablon közelítőleg W/m²-re váltja. Az
    UV-index mértékegység nélküli szám.


    ### ❗ Fontos figyelmeztetés: Csak hiteles adatokat tölts fel!


    Az Időkép térképeit és előrejelzéseit emberek százezrei használják nap mint
    nap. Kérjük, **csak és kizárólag akkor indíts adatfeltöltést, ha a
    szenzoraid elhelyezése megfelel a meteorológiai szabványoknak!** A rossz
    helyre tett műszerek (pl. napon lévő hőmérő, fal melletti szélmérő) hibás
    adatokat generálnak, amivel rontod a hálózat megbízhatóságát.


    #### 📐 Műszerelhelyezési útmutató


    * **Hőmérő és páratartalom mérő:** 2 méter magasságban, árnyékos helyen
    (lehetőleg szabványos hőmérőházban vagy tányéros árnyékolóban) kell
    elhelyezni. Szigorúan tilos falhoz, betonhoz vagy olyan felülethez
    rögzíteni, ami hőt sugározhat magából!

    * **Szélmérő:** Szabad, nyílt területen, a talajszinttől számítva ideálisan
    10 méter magasan kell lennie. Ha erre nincs mód, akkor a környező akadályok
    (háztető, fák) fölé kell nyúlnia legalább 2-3 méterrel, hogy a légáramlás
    akadálytalanul érje.

    * **Csapadékmérő:** Nyílt, vízszintes területen, a talajtól nagyjából
    1-1,5 méter magasságban telepítve. Ügyelj rá, hogy épület, fa vagy tető ne
    takarja ki, és a szél ne tudjon belefújni faleveleket.

    * **Légnyomásmérő:** Beltéren is elhelyezhető, de figyelj arra, hogy a Home
    Assistant mindig **tengerszintre átszámított (relatív) légnyomásértéket**
    küldjön, ne pedig a szenzor által mért abszolút értéket.


    ---


    **Verzió:** 2.8 · [Forráskód és változásnapló](https://github.com/adkulik/idokep.hu-uploader)
  domain: automation
  source_url: https://raw.githubusercontent.com/adkulik/idokep.hu-uploader/refs/heads/main/idokep.hu-uploader.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    fiok:
      name: Időkép fiók
      icon: mdi:account-key
      collapsed: true
      input:
        idokep_fioktipus:
          name: Fióktípus
          description: >-
            Az Időképen kétféle fiók létezik. Ha a fiókodat a haladó szintű
            regisztrációval hoztad létre, Normál fiókod van. A Pro csak
            speciális esetekben szükséges. Alapértelmezés a Normál.
          default: normal
          selector:
            select:
              mode: list
              options:
                - label: Normál
                  value: normal
                - label: Pro
                  value: pro
        feltoltesi_formatum:
          name: Feltöltési formátum
          description: >-
            Csak Normál fióknál számít. Időkép formátum: a megszokott
            `sendws.php` beküldés, 24 órás (`csap`) és napi, éjfél óta mért
            (`csapdaily`) csapadékkal. Weather Underground
            formátum: az Időkép `automata.idokep.hu` címére, a WU protokoll
            mezőneveivel és mértékegységeivel (°F, inHg, mph, inch), napi
            (éjfél óta mért) csapadékkal; a globálsugárzást csak ez fogadja.
            Pro fióknál a beküldés mindig Időkép formátumú, ez a beállítás ott
            nem hat.
          default: idokep
          selector:
            select:
              mode: list
              options:
                - label: Időkép formátum
                  value: idokep
                - label: Weather Underground formátum
                  value: wu
        idokep_user:
          name: Felhasználónév
          description: Az Időkép állomásod azonosítója.
          default: ""
          selector:
            text:
        idokep_pass:
          name: Jelszó
          description: Az állomáshoz tartozó jelszó.
          default: ""
          selector:
            text:
              type: password

    utemezes:
      name: Ütemezés
      icon: mdi:timer-outline
      collapsed: true
      input:
        feltoltes_gyakorisag:
          name: Feltöltés gyakorisága
          description: >-
            Milyen sűrűn küldjön adatot. Az Időkép percenkénti beküldést is
            elfogad, de 5 perc a legtöbb állomásnak bőven elég.
          default: "/5"
          selector:
            select:
              mode: dropdown
              options:
                - label: Percenként
                  value: "/1"
                - label: 2 percenként
                  value: "/2"
                - label: 5 percenként
                  value: "/5"
                - label: 10 percenként
                  value: "/10"
                - label: 15 percenként
                  value: "/15"

    merok:
      name: Hőmérséklet és Páratartalom
      icon: mdi:thermometer
      collapsed: true
      input:
        temp_sensor:
          name: Hőmérséklet (Kötelező)
          description: >-
            Kültéri hőmérséklet. Enélkül nem történik feltöltés. Időkép: `hom`
            (°C), WU: `tempf` (°F).
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: temperature
        humidity_sensor:
          name: Páratartalom (Opcionális)
          description: Időkép `rh`, WU `humidity` néven megy, %-ban.
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: humidity
        pressure_sensor:
          name: Légnyomás (Opcionális)
          description: >-
            Lehetőleg a **tengerszintre korrigált** értéket add meg, ne a nyers
            állomásnyomást — az Időkép ezt várja. Időkép: `p` (hPa), WU:
            `baromin` (inHg).
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: atmospheric_pressure
        indoor_temp_sensor:
          name: Beltéri hőmérséklet (Opcionális)
          description: >-
            Ha megadod, a beltéri hőmérséklet is felkerül. Ha üresen hagyod,
            a paraméter egyszerűen kimarad a beküldésből. Időkép: `inhom`
            (°C), WU: `indoortempf` (°F).
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: temperature

    szel:
      name: Szél
      icon: mdi:weather-windy
      collapsed: true
      input:
        wind_dir_sensor:
          name: Szélirány (Opcionális)
          description: >-
            Fokban (0–360) **vagy** égtáj-rövidítésként megadott érték.
            Támogatott rövidítések: N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSW,
            SW, WSW, W, WNW, NW, NNW, valamint a magyar É, ÉK, K, DK, D, DNY,
            NY, ÉNY. A kis- és nagybetű nem számít. Időkép: `szelirany`, WU:
            `winddir`, fokban.
          default: ""
          selector:
            entity:
              domain: sensor
        wind_speed_sensor:
          name: Szélsebesség (Opcionális)
          description: >-
            A mértékegységet a szenzorból olvassa ki és átváltja. Időkép:
            `szelero` (m/s), WU: `windspeedmph` (mph).
          default: ""
          selector:
            entity:
              domain: sensor
        wind_gust_sensor:
          name: Széllökés (Opcionális)
          description: >-
            A mértékegységet a szenzorból olvassa ki és átváltja. Időkép:
            `szellokes` (m/s), WU: `windgustmph` (mph).
          default: ""
          selector:
            entity:
              domain: sensor

    csapadek:
      name: Csapadék
      icon: mdi:weather-pouring
      description: >-
        Időkép formátumban az 1 órás, a 24 órás, a napi (éjfél óta mért) és az
        összes csapadék megy fel mm-ben. WU formátumban az 1 órás és a napi,
        éjfél óta mért csapadék megy fel, inch-ben.
      collapsed: true
      input:
        rain_1h:
          name: 1 órás csapadék (Opcionális)
          description: >-
            Az elmúlt 1 óra csapadékösszege mm-ben (gördülő 1 órás ablak).
            Mindkét formátumban felmegy. Időkép: `csap1h` (mm), WU: `rainin`
            (inch).
          default: ""
          selector:
            entity:
              domain: sensor
        rain_24h:
          name: 24 órás csapadék (Opcionális, csak Időkép formátum)
          description: >-
            Az elmúlt 24 óra csapadékösszege mm-ben (gördülő 24 órás ablak,
            nem az éjfél óta mért napi összeg — azt a Napi csapadék mezőben add
            meg). Időkép: `csap` (mm). WU formátumnál nem megy fel.
          default: ""
          selector:
            entity:
              domain: sensor
        rain_daily:
          name: Napi csapadék – éjfél óta (Opcionális)
          description: >-
            Az éjfél óta hullott csapadék mm-ben. Mindkét formátumban felmegy.
            Időkép: `csapdaily` (mm), WU: `dailyrainin` (inch).
          default: ""
          selector:
            entity:
              domain: sensor
        rain_total:
          name: Összes csapadék – számláló (Opcionális, csak Időkép formátum)
          description: >-
            A csapadékmérő folyamatosan növekvő összesítő számlálója mm-ben
            (nem napi és nem 24 órás érték). Időkép: `csaptotal` (mm). WU
            formátumnál nem megy fel.
          default: ""
          selector:
            entity:
              domain: sensor

    napsugarzas:
      name: Napsugárzás és UV
      icon: mdi:white-balance-sunny
      collapsed: true
      input:
        solar_radiation_sensor:
          name: Napsugárzás (Opcionális)
          description: >-
            W/m² vagy lux. A luxot közelítőleg W/m²-re váltja. Időkép:
            `napfeny` (egész W/m²), de az Időkép ezt nem jeleníti meg
            globálsugárzásként. WU: `solarradiation` (W/m²), ez jelenik meg
            globálsugárzásként.
          default: ""
          selector:
            entity:
              domain: sensor
        uv_index_sensor:
          name: UV-index (Opcionális)
          description: Mértékegység nélküli szám. Időkép `uv`, WU `UV` néven megy.
          default: ""
          selector:
            entity:
              domain: sensor

mode: single
max_exceeded: silent

variables:
  fioktipus: !input idokep_fioktipus
  formatum: !input feltoltesi_formatum
  user_name: !input idokep_user
  password: !input idokep_pass
  temp_sensor: !input temp_sensor
  hum_sensor: !input humidity_sensor
  press_sensor: !input pressure_sensor
  indoor_sensor: !input indoor_temp_sensor
  wdir_sensor: !input wind_dir_sensor
  wspeed_sensor: !input wind_speed_sensor
  wgust_sensor: !input wind_gust_sensor
  r_1h: !input rain_1h
  r_24h: !input rain_24h
  r_total: !input rain_total
  r_daily: !input rain_daily
  solar_sensor: !input solar_radiation_sensor
  uv_sensor: !input uv_index_sensor

triggers:
  - trigger: time_pattern
    minutes: !input feltoltes_gyakorisag

conditions:
  # Az összecsukható szekciók miatt a fiókadatok és a hőmérséklet-szenzor
  # üres alapértéket kaptak, ezért itt ellenőrizzük, hogy ki vannak-e töltve.
  - condition: template
    value_template: >-
      {{ user_name not in ['', none] and password not in ['', none]
         and temp_sensor not in ['', none] and is_number(states(temp_sensor)) }}

actions:
  # A választ szándékosan nem kérjük vissza (response_variable nélkül):
  # az Időkép válasza nem UTF-8 kódolású, és a rest_command ilyenkor
  # dekódolási hibát dob, amelynek üzenetében a jelszót tartalmazó URL is
  # a naplóba kerül. Válaszkérés nélkül a rest_command nem dekódolja a választ.
  - action: rest_command.idokep_get
    data:
      url: >-
        {%- set egtajak = {
          'n': 0.0, 'nne': 22.5, 'ne': 45.0, 'ene': 67.5,
          'e': 90.0, 'ese': 112.5, 'se': 135.0, 'sse': 157.5,
          's': 180.0, 'ssw': 202.5, 'sw': 225.0, 'wsw': 247.5,
          'w': 270.0, 'wnw': 292.5, 'nw': 315.0, 'nnw': 337.5,
          'é': 0.0, 'ék': 45.0, 'k': 90.0, 'dk': 135.0,
          'd': 180.0, 'dny': 225.0, 'ny': 270.0, 'ény': 315.0
        } -%}

        {%- set ms_szorzo = {
          'm/s': 1.0, 'km/h': 0.2777778, 'kph': 0.2777778,
          'mph': 0.44704, 'mi/h': 0.44704, 'kn': 0.5144444, 'kt': 0.5144444
        } -%}

        {%- macro szam(ertek) -%}
          {{ '%.2f' | format(ertek | float(0)) | replace('.', ',') }}
        {%- endmacro -%}

        {#- Fióktípus: Pro -> pro.idokep.hu, minden más (alapértelmezés: Normál) -> idokep.hu -#}
        {%- set alap = 'https://pro.idokep.hu' if (fioktipus | string | lower) == 'pro' else 'https://idokep.hu' -%}

        {%- set ns = namespace(url =
          alap ~ '/sendws.php'
          ~ '?user=' ~ (user_name | string | urlencode)
          ~ '&pass=' ~ (password | string | urlencode)
          ~ '&ev=' ~ now().year
          ~ '&ho=' ~ now().month
          ~ '&nap=' ~ now().day
          ~ '&ora=' ~ now().hour
          ~ '&perc=' ~ now().minute
          ~ '&mp=' ~ now().second) -%}

        {#- Egyszerű számértékek: hőmérséklet, pára, nyomás, beltéri hőm. -#}
        {%- for kulcs, ent in [
              ('hom', temp_sensor),
              ('rh', hum_sensor),
              ('p', press_sensor),
              ('inhom', indoor_sensor),
              ('csap', r_24h),
              ('csapdaily', r_daily),
              ('csap1h', r_1h),
              ('csaptotal', r_total)
            ] -%}
          {%- if ent not in ['', none] and is_number(states(ent)) -%}
            {%- set ns.url = ns.url ~ '&' ~ kulcs ~ '=' ~ szam(states(ent)) | trim -%}
          {%- endif -%}
        {%- endfor -%}

        {#- Szélirány: fok vagy égtáj-rövidítés -#}
        {%- if wdir_sensor not in ['', none] -%}
          {%- set nyers = states(wdir_sensor) -%}
          {%- if is_number(nyers) -%}
            {%- set fok = nyers | float(0) % 360 -%}
            {%- set ns.url = ns.url ~ '&szelirany=' ~ szam(fok) | trim -%}
          {%- elif nyers is string and egtajak.get(nyers | lower | trim) is not none -%}
            {%- set ns.url = ns.url ~ '&szelirany=' ~ szam(egtajak[nyers | lower | trim]) | trim -%}
          {%- endif -%}
        {%- endif -%}

        {#- Szélsebesség és széllökés: m/s-ra váltva a szenzor egysége alapján -#}
        {%- for kulcs, ent in [('szelero', wspeed_sensor), ('szellokes', wgust_sensor)] -%}
          {%- if ent not in ['', none] and is_number(states(ent)) -%}
            {%- set egyseg = (state_attr(ent, 'unit_of_measurement') or 'km/h') | lower | trim -%}
            {%- set szorzo = ms_szorzo.get(egyseg, 0.2777778) -%}
            {%- set ns.url = ns.url ~ '&' ~ kulcs ~ '=' ~ szam(states(ent) | float(0) * szorzo) | trim -%}
          {%- endif -%}
        {%- endfor -%}

        {#- Napsugárzás: W/m², egész számra kerekítve (az Időkép itt csak egész számot fogad el), a luxot közelítőleg W/m²-re váltva -#}
        {%- if solar_sensor not in ['', none] and is_number(states(solar_sensor)) -%}
          {%- set v = states(solar_sensor) | float(0) -%}
          {%- set egyseg = (state_attr(solar_sensor, 'unit_of_measurement') or '') | lower | trim -%}
          {%- set wm2 = (v / 126.7) if egyseg in ['lx', 'lux'] else v -%}
          {%- set ns.url = ns.url ~ '&napfeny=' ~ (wm2 | round(0) | int) -%}
        {%- endif -%}

        {#- UV-index -#}
        {%- if uv_sensor not in ['', none] and is_number(states(uv_sensor)) -%}
          {%- set ns.url = ns.url ~ '&uv=' ~ szam(states(uv_sensor)) | trim -%}
        {%- endif -%}

        {#- Weather Underground formátum: csak Normál fióknál, ha ki van választva -#}
        {%- if (fioktipus | string | lower) != 'pro' and (formatum | string | lower) == 'wu' -%}
          {%- set mph_szorzo = {
            'm/s': 2.2369363, 'km/h': 0.6213712, 'kph': 0.6213712,
            'mph': 1.0, 'mi/h': 1.0, 'kn': 1.1507794, 'kt': 1.1507794
          } -%}
          {%- set w = namespace(url =
            'https://automata.idokep.hu/weatherstation/updateweatherstation.php'
            ~ '?ID=' ~ (user_name | string | urlencode)
            ~ '&PASSWORD=' ~ (password | string | urlencode)
            ~ '&dateutc=now') -%}
          {#- Hőmérséklet: °F -#}
          {%- for kulcs, ent in [('tempf', temp_sensor), ('indoortempf', indoor_sensor)] -%}
            {%- if ent not in ['', none] and is_number(states(ent)) -%}
              {%- set v = states(ent) | float(0) -%}
              {%- set egyseg = (state_attr(ent, 'unit_of_measurement') or '°C') | lower | trim -%}
              {%- set f = v if egyseg in ['°f', 'f'] else v * 9 / 5 + 32 -%}
              {%- set w.url = w.url ~ '&' ~ kulcs ~ '=' ~ ('%.1f' | format(f)) -%}
            {%- endif -%}
          {%- endfor -%}
          {#- Páratartalom: % -#}
          {%- if hum_sensor not in ['', none] and is_number(states(hum_sensor)) -%}
            {%- set w.url = w.url ~ '&humidity=' ~ (states(hum_sensor) | float(0) | round(0) | int) -%}
          {%- endif -%}
          {#- Légnyomás: inHg -#}
          {%- if press_sensor not in ['', none] and is_number(states(press_sensor)) -%}
            {%- set v = states(press_sensor) | float(0) -%}
            {%- set egyseg = (state_attr(press_sensor, 'unit_of_measurement') or 'hPa') | lower | trim -%}
            {%- set inhg = {'inhg': 1.0, 'kpa': 0.2953006, 'mmhg': 0.0393701}.get(egyseg, 0.02953006) * v -%}
            {%- set w.url = w.url ~ '&baromin=' ~ ('%.3f' | format(inhg)) -%}
          {%- endif -%}
          {#- Szélirány: fok -#}
          {%- if wdir_sensor not in ['', none] -%}
            {%- set nyers = states(wdir_sensor) -%}
            {%- if is_number(nyers) -%}
              {%- set w.url = w.url ~ '&winddir=' ~ ((nyers | float(0) % 360) | round(0) | int) -%}
            {%- elif nyers is string and egtajak.get(nyers | lower | trim) is not none -%}
              {%- set w.url = w.url ~ '&winddir=' ~ (egtajak[nyers | lower | trim] | round(0) | int) -%}
            {%- endif -%}
          {%- endif -%}
          {#- Szélsebesség és széllökés: mph -#}
          {%- for kulcs, ent in [('windspeedmph', wspeed_sensor), ('windgustmph', wgust_sensor)] -%}
            {%- if ent not in ['', none] and is_number(states(ent)) -%}
              {%- set egyseg = (state_attr(ent, 'unit_of_measurement') or 'km/h') | lower | trim -%}
              {%- set mph = states(ent) | float(0) * mph_szorzo.get(egyseg, 0.6213712) -%}
              {%- set w.url = w.url ~ '&' ~ kulcs ~ '=' ~ ('%.1f' | format(mph)) -%}
            {%- endif -%}
          {%- endfor -%}
          {#- Csapadék: inch (1 órás és éjfél óta) -#}
          {%- for kulcs, ent in [('rainin', r_1h), ('dailyrainin', r_daily)] -%}
            {%- if ent not in ['', none] and is_number(states(ent)) -%}
              {%- set egyseg = (state_attr(ent, 'unit_of_measurement') or 'mm') | lower | trim -%}
              {%- set inch = states(ent) | float(0) if egyseg in ['in', 'inch'] else states(ent) | float(0) / 25.4 -%}
              {%- set w.url = w.url ~ '&' ~ kulcs ~ '=' ~ ('%.3f' | format(inch)) -%}
            {%- endif -%}
          {%- endfor -%}
          {#- Napsugárzás: W/m², a luxot közelítőleg W/m²-re váltva -#}
          {%- if solar_sensor not in ['', none] and is_number(states(solar_sensor)) -%}
            {%- set v = states(solar_sensor) | float(0) -%}
            {%- set egyseg = (state_attr(solar_sensor, 'unit_of_measurement') or '') | lower | trim -%}
            {%- set wm2 = (v / 126.7) if egyseg in ['lx', 'lux'] else v -%}
            {%- set w.url = w.url ~ '&solarradiation=' ~ ('%.1f' | format(wm2)) -%}
          {%- endif -%}
          {#- UV-index -#}
          {%- if uv_sensor not in ['', none] and is_number(states(uv_sensor)) -%}
            {%- set w.url = w.url ~ '&UV=' ~ ('%.1f' | format(states(uv_sensor) | float(0))) -%}
          {%- endif -%}
          {{ w.url ~ '&softwaretype=HA_Uploader&action=updateraw' }}
        {%- else -%}
          {{ ns.url ~ '&tipus=HA_Uploader' }}
        {%- endif -%}
